# Builds FreeMyTV.apk on GitHub's servers. Put this file in your fork at .github/workflows/build-apk.yml,
# then Actions -> "Build APK" -> Run workflow. Download the APK from the finished run (Artifacts).
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 platforms;android-34"

      - name: Write config.properties
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          cat > config.properties <<EOF
          tmdb_key=${TMDB_KEY}
          tmdb_region=SA
          latitude=21.4858
          longitude=39.1925
          city=Jeddah
          hide_animation=false
          language=auto
          show_crypto=false
          temperature=C
          disable_assistant=false
          hide_services=
          watchmode_key=
          EOF

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV
          path: FreeMyTV.apk
          if-no-files-found: error
